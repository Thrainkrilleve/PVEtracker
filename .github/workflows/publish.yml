name: Publish to PyPI

# Publishing a GitHub Release (tag "v<version>", e.g. v0.1.0) builds the
# package and uploads it to PyPI through PyPI's trusted publishing. No API
# token is stored anywhere: PyPI trusts this file (publish.yml) running in the
# "Pypi" environment of this repository.

on:
  release:
    types: [published]
  workflow_dispatch: # build only, to check the package without publishing

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('aa_pilotstats/__init__.py').read_text()).group(1))")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG doesn't match the package version $VERSION (expected v$VERSION)."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: Pypi
      url: https://pypi.org/project/aa-pilotstats/
    permissions:
      id-token: write # trusted publishing; nothing else is granted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
