name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Alliance Auth ${{ matrix.allianceauth }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported release and the release COMP's playground runs.
        allianceauth: ["5.0.0", "5.6.0"]
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MySQL client build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential
      - name: Install Alliance Auth ${{ matrix.allianceauth }} and this app
        run: |
          python -m pip install --upgrade pip
          pip install "allianceauth==${{ matrix.allianceauth }}"
          pip install -e . --no-deps
      - name: Check migrations match the models
        env:
          DJANGO_SETTINGS_MODULE: settings_dev
        run: python manage.py makemigrations pvetracker --check --dry-run
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: settings_dev
        run: python manage.py test aa_pvetracker --verbosity=1
