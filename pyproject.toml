[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "aa-pvetracker"
description = "Fleet damage & logi tracking for Alliance Auth — upload EVE combat logs, attribute stats to characters/mains, and see a fleet leaderboard."
readme = "README.md"
keywords = ["allianceauth", "eve online", "combat log", "dps", "logi", "leaderboard"]
license = { file = "LICENSE" }
authors = [{ name = "Thrainkrilleve" }]
requires-python = ">=3.10"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = ["version"]
dependencies = ["allianceauth>=4.3.1,<6"]

[project.urls]
Homepage = "https://github.com/Thrainkrilleve/PVEtracker"
Repository = "https://github.com/Thrainkrilleve/PVEtracker"
"Bug Tracker" = "https://github.com/Thrainkrilleve/PVEtracker/issues"

[tool.hatch.version]
path = "aa_pvetracker/__init__.py"

[tool.hatch.build]
include = ["/aa_pvetracker"]
