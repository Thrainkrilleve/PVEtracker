name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MySQL client build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential
      - name: Install Alliance Auth 5.6.0 and this app
        run: |
          python -m pip install --upgrade pip
          pip install "allianceauth==5.6.0"
          pip install -e . --no-deps
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: settings_dev
        run: python manage.py test aa_pvetracker --verbosity=1
